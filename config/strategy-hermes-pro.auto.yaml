profile: hermes-pro-auto
description: Professional operator mode for Hermes. This profile is less timid than
  the stable-risk baseline, but still treats liquidation avoidance and durable survival
  as the first objective. It enters earlier when internal signals and external context
  align, while keeping hard risk caps and exchange minimums. Auto-tuned from closed-trade
  reviews.
defaults:
  symbol: NEARUSDT
  market: futures
  interval: 1h
  limit: 500
  use_blave: false
  render_chart: true
risk:
  max_account_risk_pct: 0.014
  default_leverage: 6
  max_leverage: 30
  max_notional_pct: 0.45
  max_daily_trades: 8
  min_balance_usdt: 2.0
  min_convergence: 0.79
  min_score_long: 71
  max_score_short: 29
  cooldown_hours: 7.0
  atr_stop_multiple: 1.6
  min_adx: 23.0
  trailing_stop_enabled: true
  trailing_activation_r_multiple: 1.1
  trailing_callback_pct: 0.5
  take_profit_r_multiples:
  - 1.3
  - 2.3
  - 3.4
signal:
  ema_fast: 13
  ema_slow: 34
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 3.0
  margin_notional_usdt: null
challenge:
  enabled: true
  target_multiple: 2.0
  max_drawdown_pct: 18.0
  pause_on_target: true
  pause_on_drawdown_breach: true
