meta:
  lane_mode: multi_asset_simulation_first
  description: >
    Multi-asset simulation lane. Route each symbol to its own strategy profile,
    record paper/demo entries automatically, and keep live execution disabled.

strategy:
  strategy_config: strategy-stable-risk.yaml
  routing_config: asset-routing.default.yaml

automation:
  review_closed_trades: true
  auto_pause: true
  review_limit: 20
  execute_live_entries: false
  execute_simulated_entries: true
  execute_position_protection: false
  require_digest_action: pre_trade_notify
  require_strategy_analyzer_approval: true
  min_strategy_analyzer_confidence: 0.62
  max_managed_positions: 3
  candidate_symbol_source: digest_selected

integrations:
  digest_enabled: true
  reuse_cached_digest: true
  digest_min_interval_minutes: 240
  skip_digest_when_positions_open: true
  digest_config: n8n-daily-digest.default.json
  hailo_enabled: true
  hailo_config: config.yaml

risk:
  trailing_callback_pct: 0.7
  margin_notional_usdt: 3.0
  simulation_notional_usdt: 3.0
  min_expected_profit_usdt: 1.0
  require_professional_entry_gate: true
  min_reward_risk: 1.2
  min_net_profit_to_risk: 0.8
  max_fee_profit_ratio: 0.35
  max_slippage_profit_ratio: 0.25
  max_volatility: 1.8
  min_volume_zscore: -0.8
  min_recent_reviews: 6
  min_recent_win_rate: 0.42
  min_recent_avg_r: 0.0
  max_recent_stop_loss_ratio: 0.55
  recent_lookback: 20
  stop_loss_cooldown_hours: 6
