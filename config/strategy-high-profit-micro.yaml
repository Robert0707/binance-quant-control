profile: high-profit-micro
description: >
  Aggressive micro-account configuration for cases where the user requires
  each winning trade to clear a larger absolute profit threshold. Uses
  higher leverage and larger take-profit multiples on low-priced, liquid
  futures symbols.
defaults:
  symbol: DOGEUSDT
  market: futures
  interval: 4h
  limit: 500
  use_blave: false
  render_chart: true
risk:
  max_account_risk_pct: 0.05
  default_leverage: 25
  max_leverage: 25
  max_notional_pct: 1.0
  max_daily_trades: 2
  min_balance_usdt: 2.0
  min_convergence: 0.8
  min_score_long: 80
  max_score_short: 20
  cooldown_hours: 8
  atr_stop_multiple: 1.5
  min_adx: 18
  trailing_stop_enabled: true
  trailing_activation_r_multiple: 1.7
  trailing_callback_pct: 1.0
  take_profit_r_multiples:
    - 2.0
    - 4.0
signal:
  ema_fast: 13
  ema_slow: 34
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 3.0
challenge:
  enabled: true
  target_multiple: 2.0
  max_drawdown_pct: 18.0
  pause_on_target: true
  pause_on_drawdown_breach: true
