strategy:
  base_strategy_config: strategy-hermes-pro.yaml

policy:
  min_closed_reviews: 6
  lookback_reviews: 400
  lookback_reviews_per_route: 80
  screening_min_win_rate: 65
  screening_min_profit_factor: 1.2
  screening_min_expectancy_r: 0.05
  screening_min_payoff_ratio: 1.0
  screening_min_trades: 100
  validation_min_win_rate: 70
  validation_min_profit_factor: 1.5
  validation_min_expectancy_r: 0.1
  validation_min_payoff_ratio: 1.15
  validation_min_simulated_trades: 100
  elite_min_win_rate: 80
  elite_min_profit_factor: 1.5
  max_stop_loss_ratio: 0.35
  max_loss_streak: 3
  max_drawdown_pct: 15
  min_avg_r_multiple: 0.2
  ignore_legacy_unrouted: true
  exclude_flat_manual_closes: true

output:
  output_strategy_config: strategy-hermes-pro.auto.yaml
  auto_apply: true
