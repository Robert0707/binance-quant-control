profile: btc-volatility
description: >
  BTC core volatility lane. Uses higher ADX and convergence so breakout entries
  only trigger when structure and momentum align.
defaults:
  symbol: BTCUSDT
  market: futures
  interval: 4h
  limit: 500
  use_blave: false
  render_chart: true
risk:
  max_account_risk_pct: 0.02
  default_leverage: 10
  max_leverage: 30
  max_notional_pct: 0.5
  max_daily_trades: 8
  min_balance_usdt: 5.0
  min_convergence: 0.62
  min_score_long: 58
  max_score_short: 42
  cooldown_hours: 1
  atr_stop_multiple: 1.8
  min_adx: 12
  trailing_stop_enabled: true
  trailing_activation_r_multiple: 1.1
  trailing_callback_pct: 0.7
  take_profit_r_multiples: [1.6, 2.8, 4.2]
signal:
  ema_fast: 13
  ema_slow: 34
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 2.0
challenge:
  enabled: true
  target_multiple: 2.0
  max_drawdown_pct: 12.0
  pause_on_target: true
  pause_on_drawdown_breach: true
