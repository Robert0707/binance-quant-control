profile: market-bot-payoff-research
description: >
  Payoff-first research profile for AI-trader discovery. This profile keeps
  risk small while testing wider asymmetric exits and larger runner targets.
  It is research-only and must pass market-bot-gate before any execution lane.
defaults:
  symbol: BTCUSDT
  market: futures
  interval: 4h
  limit: 1500
  use_blave: false
  render_chart: false
risk:
  max_account_risk_pct: 0.006
  default_leverage: 2
  max_leverage: 4
  max_notional_pct: 0.10
  max_daily_trades: 3
  min_balance_usdt: 5.0
  min_convergence: 0.66
  min_score_long: 64
  max_score_short: 36
  cooldown_hours: 10
  atr_stop_multiple: 1.35
  min_adx: 14
  trailing_stop_enabled: true
  trailing_activation_r_multiple: 0.8
  trailing_callback_pct: 0.45
  exit_profile: asymmetric_payoff
  time_limit_bars: 72
  take_profit_r_multiples:
    - 1.2
    - 2.4
    - 4.8
signal:
  ema_fast: 13
  ema_slow: 34
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 3.0
  margin_notional_usdt: 5.0
challenge:
  enabled: false
  target_multiple: 1.5
  max_drawdown_pct: 8.0
  pause_on_target: true
  pause_on_drawdown_breach: true
