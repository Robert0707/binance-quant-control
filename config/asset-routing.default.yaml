      validation_min_win_rate: 70
      validation_min_profit_factor: 1.5
      validation_min_expectancy_r: 0.1
      validation_min_payoff_ratio: 1.15
      validation_min_simulated_trades: 100
      max_drawdown_pct: 14
      max_loss_streak: 3
      elite_enabled: true
      elite_min_win_rate: 90
      elite_min_profit_factor: 1.5
      elite_min_trades: 100

  doge-meme-high-beta:
    asset_class: meme_high_beta
    symbols:
      - DOGEUSDT
    strategy_config: strategy-meme-momentum.yaml
    market: futures
    interval: 4h
    simulation_mode: paper
    review_lane: doge-market-bot-review
    rationale: >
      DOGE has its own market-bot route because the six-symbol router validated
      DOGE separately from the older broad meme basket. Keep high-beta sizing,
      but do not inherit quarantine or side-risk history from unrelated meme
      symbols.
    tags: [meme, high-beta, market-bot, doge]
    validation:
      screening_min_win_rate: 65
      screening_min_profit_factor: 1.2
      screening_min_expectancy_r: 0.05
      screening_min_payoff_ratio: 1.0
      screening_min_trades: 100
      validation_min_win_rate: 70
      validation_min_profit_factor: 1.5
      validation_min_expectancy_r: 0.1
      validation_min_payoff_ratio: 1.15
      validation_min_simulated_trades: 100
      max_drawdown_pct: 18
      max_loss_streak: 3
      elite_enabled: true
      elite_min_win_rate: 90
      elite_min_profit_factor: 1.5
      elite_min_trades: 100

  meme-high-beta:
    asset_class: meme_high_beta
    symbols:
      - PENGUUSDT
      - 1000PEPEUSDT
      - 1000LUNCUSDT
      - TRUMPUSDT
      - WIFUSDT
      - ORCAUSDT
      - HYPERUSDT
      - SOONUSDT
      - APEUSDT
      - AXSUSDT
      - API3USDT
    strategy_config: strategy-meme-momentum.yaml
    market: futures
    interval: 1h
    simulation_mode: paper
    review_lane: meme-beta-review
    rationale: >
      High-beta and meme symbols get a faster lane with tighter trailing and
      stricter post-trade review because regime shifts are violent.
    tags: [meme, high-beta, fast-review]
    validation:
      screening_min_win_rate: 65
      screening_min_profit_factor: 1.2
      screening_min_expectancy_r: 0.05
      screening_min_payoff_ratio: 1.0
      screening_min_trades: 100
      validation_min_win_rate: 70
      validation_min_profit_factor: 1.5
      validation_min_expectancy_r: 0.1
      validation_min_payoff_ratio: 1.15
      validation_min_simulated_trades: 100
      max_drawdown_pct: 18
      max_loss_streak: 3
      elite_enabled: true
      elite_min_win_rate: 90
      elite_min_profit_factor: 1.5
      elite_min_trades: 100

  defensive-unknown:
    asset_class: defensive_unknown
    symbols: []
    strategy_config: strategy-defensive-default.yaml
    market: futures
    interval: 4h
    simulation_mode: paper
    review_lane: unknown-paper-review
    rationale: >
      Unknown symbols stay on the most conservative paper-first lane until they
      earn a dedicated route.
    tags: [unknown, conservative, paper-only]
    validation:
      screening_min_win_rate: 65
      screening_min_profit_factor: 1.2
