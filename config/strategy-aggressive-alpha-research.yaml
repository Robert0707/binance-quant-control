profile: aggressive-alpha-research
description: >
  Demo/testnet-only alpha research profile. It is intentionally allowed to
  explore higher reward/risk and leverage assumptions in backtests, but it must
  not be promoted directly to mainnet live trading.
defaults:
  symbol: ETHUSDT
  market: futures
  interval: 1h
  limit: 800
  use_blave: false
  render_chart: false
risk:
  max_account_risk_pct: 0.012
  default_leverage: 4
  max_leverage: 8
  max_notional_pct: 0.18
  max_daily_trades: 6
  min_balance_usdt: 2.0
  min_convergence: 0.7
  min_score_long: 68
  max_score_short: 32
  cooldown_hours: 4
  atr_stop_multiple: 1.8
  min_adx: 20
  trailing_stop_enabled: true
  trailing_activation_r_multiple: 1.0
  trailing_callback_pct: 1.0
  take_profit_r_multiples:
    - 1.4
    - 2.8
    - 5.0
signal:
  ema_fast: 13
  ema_slow: 34
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 3.0
  margin_notional_usdt: 8.0
challenge:
  enabled: false
  target_multiple: 2.0
  max_drawdown_pct: 25.0
  pause_on_target: true
  pause_on_drawdown_breach: true
