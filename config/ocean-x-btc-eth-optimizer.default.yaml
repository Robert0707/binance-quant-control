meta:
  lane_mode: btc_eth_expectancy_convergence_optimizer
  description: >
    Research-only optimizer for transparent BTC/ETH TradingView-inspired
    convergence strategies. It started from the Ocean-X / whale-jump proxy,
    then adds public TradingView concept families such as Supertrend+MACD,
    StochRSI pullback, VWAP trend, range RSI, and Banker Fund Flow proxy.
    The finished gate is expectancy-first, not 80%-win-rate-first. This file is
    not used by live execution and must not enable orders.

safety:
  mainnet_live_allowed: false
  writes_execution_config: false
  opens_orders: false
  research_gate_only: true

data:
  symbols: [BTCUSDT, ETHUSDT]
  market: futures
  interval: 1h
  start: "2024-05-03"
  end: "2026-05-03"

targets:
  gate_mode: expectancy
  target_win_rate: 45.0
  min_train_trades: 70
  min_test_trades: 30
  min_profit_factor: 1.20
  min_expectancy_pct: 0.03
  min_payoff_ratio: 1.20
  max_drawdown_pct: 20.0
  max_loss_streak: 8
  max_stop_loss_ratio: 55.0
  max_per_trade_risk_pct: 2.50
  min_dataset_bars: 1000
  min_coverage_ratio: 0.65

runner:
  script: scripts/research_ocean_x_btc_evidence.py
  command: >
    python3 scripts/research_ocean_x_btc_evidence.py --optimize-btc-eth-tradingview
    --symbols BTCUSDT,ETHUSDT --start 2024-05-03 --end 2026-05-03
    --interval 1h --gate-mode expectancy --target-win-rate 45
    --min-train-trades 70 --min-test-trades 30 --min-profit-factor 1.2
    --min-expectancy-pct 0.03 --min-payoff-ratio 1.2
    --max-drawdown-pct 20 --max-loss-streak 8 --max-stop-loss-ratio 55
    --max-per-trade-risk-pct 2.5
    --regime-filters none,trend,pullback,liquidity,range,strong_flow
    --max-full-evaluations 0

latest_reports:
  baseline_sample_sweep: reports/20260503T124854Z-btc-eth-ocean-x-optimizer/optimizer_summary.json
  uniform_space_sweep: reports/20260503T171144Z-btc-eth-ocean-x-optimizer/optimizer_summary.json
  core_whale_jump_standard: reports/20260504T-core-whale-jump-standard/optimizer_summary.json
  btc_eth_tradingview_convergence: reports/20260504T-btc-eth-tradingview-convergence/optimizer_summary.json
  btc_eth_tradingview_convergence_full: reports/20260504T-btc-eth-tradingview-convergence-full/optimizer_summary.json
  btc_eth_expectancy_1h_full: reports/20260504T-btc-eth-tradingview-expectancy-rr-1h-full/optimizer_summary.json
  btc_eth_expectancy_30m_full: reports/20260504T-btc-eth-tradingview-expectancy-30m-full/optimizer_summary.json

