next_iteration:
  priority: expectancy_first_paper_candidate_generation
  ideas:
    - Continue BTC/ETH only; XAUT is out of this focused lane.
    - Treat win rate as descriptive only; do not use 80 percent as a hard gate.
    - Promote only positive net expectancy with adequate sample, PF, payoff, drawdown, loss-streak, and walk-forward stability.
    - Run 15m or 30m as a background job if more sample is needed.
    - Improve payoff structure before adding more entry filters.
    - Add fee/slippage stress after any candidate passes train, test, and walk-forward.
    - Keep the 2.5 percent per-trade risk ceiling if this graduates from research.
