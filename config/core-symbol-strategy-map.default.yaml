      as a regime and liquidity reference until a positive pullback/breakout
      model appears. The 2026-05-02 Fibonacci/OTE trend_pullback run stayed
      negative on BTC 1h/4h, and the 2026-05-04 rolling VWAP reclaim smoke
      produced no BTC sample, so BTC remains a regime reference only.
