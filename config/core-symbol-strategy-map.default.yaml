meta:
  description: >
    Web-informed, interval-aware, and backtest-gated strategy map for the
    current 10-symbol focus universe. Families are mutually exclusive per
    symbol/interval during research: indicators inside a family act as filters,
    not duplicated votes.
  generated_from:
    - Binance USD-M Futures exchangeInfo: confirms all 10 symbols are TRADING perpetual contracts.
    - TradingView indicator research: Bollinger/MACD/SuperTrend/JUMBO/VWAP/volume tools are filters inside family lanes.
    - Local core-10-mtf-strategy-map-refined-l1500 backtests: only long-sample survivors remain active.
    - Web research through 2026-05-02: 15m/1h crypto edges need momentum/reversal switching; 1d is treated as regime context.
    - Mainstream bot boundary review on 2026-05-03: new entries must be controlled by exchange filters, pre-trade risk, triple-barrier exits, drawdown guards, liquidity filters, and funding/OI crowding vetoes.
    - 2026-05-04 VWAP reclaim smoke: broad rolling-VWAP reclaim was connected but failed l1500 gate, so it remains research-only and is not a default core active lane.

defaults:
  interval: 4h
  execution_lane: paper_research_only
  promotion:
    min_trades: 100
    min_profit_factor: 1.50
    min_win_rate: 65.0
    max_stop_loss_ratio: 35.0
    min_expectancy_r: 0.10
    min_payoff_ratio: 1.15

