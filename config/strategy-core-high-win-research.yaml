profile: core-high-win-research
description: >
  Core-symbol research profile for BTC, ETH, tokenized gold proxies, and liquid
  majors. It is deliberately low-frequency and testnet/paper-only: the first
  objective is cutting pure stop-loss exits, not maximizing trade count.
defaults:
  symbol: ETHUSDT
  market: futures
  interval: 4h
  limit: 1500
  use_blave: false
  render_chart: false
risk:
  max_account_risk_pct: 0.006
  default_leverage: 2
  max_leverage: 4
  max_notional_pct: 0.10
  max_daily_trades: 3
  min_balance_usdt: 5.0
  min_convergence: 0.72
  min_score_long: 70
  max_score_short: 30
  cooldown_hours: 12
  atr_stop_multiple: 1.2
  min_adx: 16
  trailing_stop_enabled: true
  trailing_activation_r_multiple: 0.6
  trailing_callback_pct: 0.35
  exit_profile: payoff_runner
  time_limit_bars: 72
  take_profit_r_multiples:
    - 1.0
    - 1.8
    - 3.2
signal:
  ema_fast: 13
  ema_slow: 34
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 3.0
  margin_notional_usdt: 5.0
challenge:
  enabled: false
  target_multiple: 1.5
  max_drawdown_pct: 8.0
  pause_on_target: true
  pause_on_drawdown_breach: true
