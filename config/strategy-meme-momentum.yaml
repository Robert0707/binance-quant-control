profile: meme-momentum
description: >
  Fast high-beta lane for meme and event-driven symbols. Uses tighter review
  cadence, smaller notional assumptions, and faster trailing protection.
defaults:
  symbol: DOGEUSDT
  market: futures
  interval: 1h
  limit: 500
  use_blave: false
  render_chart: true
risk:
  max_account_risk_pct: 0.01
  default_leverage: 5
  max_leverage: 30
  max_notional_pct: 0.28
  max_daily_trades: 8
  min_balance_usdt: 3.0
  min_convergence: 0.54
  min_score_long: 52
  max_score_short: 48
  cooldown_hours: 1
  atr_stop_multiple: 1.3
  min_adx: 10
  trailing_stop_enabled: true
  trailing_activation_r_multiple: 0.9
  trailing_callback_pct: 0.6
  take_profit_r_multiples: [1.2, 2.0, 3.0]
signal:
  ema_fast: 13
  ema_slow: 34
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 4.0
  margin_notional_usdt: 3.0
challenge:
  enabled: true
  target_multiple: 2.0
  max_drawdown_pct: 10.0
  pause_on_target: true
  pause_on_drawdown_breach: true
