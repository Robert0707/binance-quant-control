profile: conservative-intraday
defaults:
  symbol: BTCUSDT
  market: futures
  interval: 1h
  limit: 500
  use_blave: true
  render_chart: true
risk:
  max_account_risk_pct: 0.02
  default_leverage: 2
  max_leverage: 2
  max_notional_pct: 0.5
  max_daily_trades: 3
  min_balance_usdt: 2.0
  min_convergence: 0.6
  min_score_long: 60
  max_score_short: 40
  cooldown_hours: 4.0
  atr_stop_multiple: 1.8
  take_profit_r_multiples:
    - 1.5
    - 2.5
    - 4.0
signal:
  ema_fast: 21
  ema_slow: 55
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 2.0
challenge:
  enabled: false
  target_multiple: 2.0
  max_drawdown_pct: 20.0
  pause_on_target: true
  pause_on_drawdown_breach: true
