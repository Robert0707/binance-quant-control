profile: defensive-paper-default
description: >
  Exploratory fallback for unrouted top-volume symbols. Uses small dynamic
  sizing instead of a paper-only conservative lane so testnet can gather real
  exchange feedback while keeping notional and stop-risk bounded.
defaults:
  symbol: BTCUSDT
  market: futures
  interval: 4h
  limit: 500
  use_blave: false
  render_chart: true
risk:
  max_account_risk_pct: 0.008
  default_leverage: 4
  max_leverage: 30
  max_notional_pct: 0.2
  max_daily_trades: 8
  min_balance_usdt: 5.0
  min_convergence: 0.52
  min_score_long: 52
  max_score_short: 48
  cooldown_hours: 1
  atr_stop_multiple: 1.6
  min_adx: 10
  trailing_stop_enabled: true
  trailing_activation_r_multiple: 1.0
  trailing_callback_pct: 0.7
  take_profit_r_multiples: [1.4, 2.4, 3.4]
signal:
  ema_fast: 13
  ema_slow: 34
  rsi_length: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  breakout_length: 20
execution:
  order_type: MARKET
  margin_type: ISOLATED
  reduce_only_close: true
  fee_bps: 4.0
  slippage_bps: 3.0
challenge:
  enabled: true
  target_multiple: 1.5
  max_drawdown_pct: 8.0
  pause_on_target: true
  pause_on_drawdown_breach: true
